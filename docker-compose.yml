services:
  postgres:
    image: postgres:16-alpine
    container_name: gsp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gsp_user
      POSTGRES_PASSWORD: gsp_secret
      POSTGRES_DB: gaussian_db
    ports:
      - "5433:5432"
    volumes:
      - gsp_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gsp-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  gsp_pgdata:
